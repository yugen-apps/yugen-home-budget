on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      server_name:
        required: true
        type: string
      database:
        required: true
        type: string
      # user_id:
      #   required: true
      #   type: string

jobs:
  deploy_ef:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    env:
      EF_BUNDLE: "efbundle"
      ARTIFACTS_DIR: "artifacts"

    steps:          
      # - name: Download appsettings.json artifact from build job
      #   uses: actions/download-artifact@v8
      #   with:
      #     name: appsettings
      #     path: ${{ env.ARTIFACTS_DIR }}

      - name: Download efbundle artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.EF_BUNDLE }}
          path: ${{ env.ARTIFACTS_DIR }}

      - name: chmod
        shell: bash
        run: sudo chmod +x ./${{ env.ARTIFACTS_DIR }}/${{ env.EF_BUNDLE }}

      - name: Debug bundle directory
        shell: bash
        run: ls -al ${{ env.ARTIFACTS_DIR }}

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Apply EF migration script
        uses: azure/powershell@v3
        with:
          azPSVersion: "latest"
          failOnStandardError: true 
          inlineScript: >
            ./${{ env.ARTIFACTS_DIR }}/${{ env.EF_BUNDLE }}
            --connection 'Server=tcp:${{ inputs.server_name }};Database=${{ inputs.database }};Encrypt=True;Authentication=Active Directory Default;'
            --verbose