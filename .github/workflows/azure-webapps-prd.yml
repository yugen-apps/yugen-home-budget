name: PRD Build and deploy Azure Web App

on:
  push:
    branches:
      - release/*
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build_and_deploy:
    uses: "./.github/workflows/build-and-deploy.yml"
    secrets: inherit
    with:
      azure_webapp_name: "webapp-yugen-home-budget-prd"
      data_project_name: "Yugen.Home.Budget.Data"
      database: "sql-db-yugen-homebudget-prd"
      environment_name: "PRD"
      server_name: "sql-server-yugen.database.windows.net,1433"
      server_project_name: "Yugen.Home.Budget.Server"
      user_id: "ddc4c0ff-bab8-4f28-adda-7afa0a086920"
