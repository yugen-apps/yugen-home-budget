name: DEV Build and deploy Azure Web App

on:
  push:
    branches:
      - dev/*
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build_web_app:
    uses: "./.github/workflows/build-web-app.yml"
    secrets: inherit
    with:
      server_project_name: Yugen.HomeBudget.Server

  deploy_web_app_prod:
    uses: "./.github/workflows/deploy-web-app.yml"
    needs: [build_web_app]
    secrets: inherit
    with:
      environment_name: "DEV"
      azure_webapp_name: webapp-yugen-home-budget-dev
      server_name: "sql-server-yugen.database.windows.net,1433"
      database: "sql-db-yugen-homebudget-dev"
      user_id: "ddc4c0ff-bab8-4f28-adda-7afa0a086920"

  build_ef:
    uses: "./.github/workflows/build-ef.yml"
    secrets: inherit
    with:
      data_project_name: Yugen.HomeBudget.Data
      server_project_name: Yugen.HomeBudget.Server
      # major_minor_patch: ${{needs.build_web_app.outputs.major_minor_patch}}

  deploy_ef:
    uses: "./.github/workflows/deploy-ef.yml"
    needs: [build_ef]
    secrets: inherit
    with:
      environment_name: 'DEV'
      server_name: "sql-server-yugen.database.windows.net,1433"
      database: "sql-db-yugen-homebudget-dev"
      # user_id: "ddc4c0ff-bab8-4f28-adda-7afa0a086920"
